rules:
  - id: diff-dynamic-code
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not execute source observations as JavaScript; parse structured data instead.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: diff-disable-tls
    languages: [javascript, typescript]
    severity: ERROR
    message: Keep TLS certificate verification enabled for source retrieval.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: process.env['NODE_TLS_REJECT_UNAUTHORIZED'] = '0'
      - pattern: '{ ..., rejectUnauthorized: false, ... }'
